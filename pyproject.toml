[project]
name = "super-ai-stack"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.2.0",
    "faiss-cpu>=1.10.0",
    "uvicorn[standard]>=0.35.0",
]

[project.scripts]
super-ai-stack = "super_ai_stack:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
