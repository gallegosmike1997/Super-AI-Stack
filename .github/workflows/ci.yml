name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The stack targets Windows as well as Linux, so test both.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Import-check every service
        run: python -c "import gateway.main, router.main, memory.main, agent.main, model_manager.main, speech.main, image_gen.main, vision.main, llm_general.main, llm_coding.main, llm_reasoning.main"

      - name: Run tests
        run: python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: python -m pip install --upgrade pip && pip install ruff

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

  compose:
    # Fail fast if the Compose file is malformed or a referenced file is missing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the Compose file
        run: docker compose -f infra/docker-compose.yml config --quiet

      - name: Validate the Compose overlays
        run: |
          docker compose -f infra/docker-compose.yml -f infra/docker-compose.gpu.yml config --quiet
          docker compose -f infra/docker-compose.yml -f infra/docker-compose.monitoring.yml config --quiet
