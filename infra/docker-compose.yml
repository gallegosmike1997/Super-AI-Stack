services:
  gateway:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: uvicorn gateway.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      ROUTER_URL: http://router:8001
      SUPER_AI_API_KEY: ${SUPER_AI_API_KEY:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      # The gateway streams tokens straight from the model runtime.
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      MODEL_MAX_TOKENS: ${MODEL_MAX_TOKENS:-1024}
    depends_on:
      - router
    volumes:
      - session_data:/data

  router:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: uvicorn router.main:app --host 0.0.0.0 --port 8001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ROUTER_MODEL_BASE_URL: ${ROUTER_MODEL_BASE_URL:-}
      ROUTER_MODEL_NAME: ${ROUTER_MODEL_NAME:-phi3:mini}
      MODEL_BASE_URL: ${ROUTER_MODEL_BASE_URL:-}
      MODEL_NAME: ${ROUTER_MODEL_NAME:-phi3:mini}
      MODEL_TIMEOUT: ${ROUTER_MODEL_TIMEOUT:-120}
      ROUTER_MAX_TOKENS: ${ROUTER_MAX_TOKENS:-160}
      MODEL_MAX_TOKENS: ${ROUTER_MAX_TOKENS:-160}
      GENERAL_URL: http://llm_general:8002
      CODING_URL: http://llm_coding:8003
      MEMORY_URL: http://memory:8004
      REASONING_URL: http://llm_reasoning:8005
      VISION_URL: http://vision:8006
      SPEECH_URL: http://speech:8007
      IMAGE_URL: http://image_gen:8008
      AGENT_URL: http://agent:8009
    depends_on:
      - llm_general
      - llm_coding
      - memory
      - llm_reasoning
      - vision
      - speech
      - image_gen

  llm_general:
    build: {context: .., dockerfile: infra/Dockerfile}
    command: uvicorn llm_general.main:app --host 0.0.0.0 --port 8002
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MODEL_BASE_URL: ${GENERAL_MODEL_BASE_URL:-http://host.docker.internal:11434}
      MODEL_NAME: ${GENERAL_MODEL_NAME:-llama3.1}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_TIMEOUT: ${GENERAL_MODEL_TIMEOUT:-120}
      MODEL_MAX_TOKENS: ${MODEL_MAX_TOKENS:-1024}
  llm_coding:
    build: {context: .., dockerfile: infra/Dockerfile}
    command: uvicorn llm_coding.main:app --host 0.0.0.0 --port 8003
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MODEL_BASE_URL: ${CODING_MODEL_BASE_URL:-http://host.docker.internal:11434}
      MODEL_NAME: ${CODING_MODEL_NAME:-qwen2.5-coder:7b}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_TIMEOUT: ${CODING_MODEL_TIMEOUT:-600}
      MODEL_MAX_TOKENS: ${MODEL_MAX_TOKENS:-1024}
  memory:
    build: {context: .., dockerfile: infra/Dockerfile}
    command: uvicorn memory.main:app --host 0.0.0.0 --port 8004
    volumes:
      - memory_data:/data
  llm_reasoning:
    build: {context: .., dockerfile: infra/Dockerfile}
    command: uvicorn llm_reasoning.main:app --host 0.0.0.0 --port 8005
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MODEL_BASE_URL: ${REASONING_MODEL_BASE_URL:-http://host.docker.internal:11434}
      MODEL_NAME: ${REASONING_MODEL_NAME:-deepseek-r1:8b}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_TIMEOUT: ${REASONING_MODEL_TIMEOUT:-300}
      MODEL_MAX_TOKENS: ${MODEL_MAX_TOKENS:-1024}
  vision:
    build: {context: .., dockerfile: infra/Dockerfile}
    command: uvicorn vision.main:app --host 0.0.0.0 --port 8006
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MODEL_BASE_URL: ${VISION_MODEL_BASE_URL:-http://host.docker.internal:11434}
      MODEL_NAME: ${VISION_MODEL_NAME:-qwen2.5vl:3b}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_TIMEOUT: ${VISION_MODEL_TIMEOUT:-180}
      MODEL_MAX_TOKENS: ${MODEL_MAX_TOKENS:-1024}
  speech:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        INSTALL_SPEECH: "true"
    command: uvicorn speech.main:app --host 0.0.0.0 --port 8007
    environment:
      MODEL_NAME: ${WHISPER_MODEL:-small}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
    volumes:
      - whisper_cache:/root/.cache/huggingface
  image_gen:
    build: {context: .., dockerfile: infra/Dockerfile}
    command: uvicorn image_gen.main:app --host 0.0.0.0 --port 8008
    environment:
      IMAGE_MODEL_BASE_URL: ${IMAGE_MODEL_BASE_URL:-}
      IMAGE_MODEL_NAME: ${IMAGE_MODEL_NAME:-stable-diffusion-3}
      IMAGE_STEPS: ${IMAGE_STEPS:-20}
      IMAGE_WIDTH: ${IMAGE_WIDTH:-512}
      IMAGE_HEIGHT: ${IMAGE_HEIGHT:-512}
      IMAGE_TIMEOUT: ${IMAGE_TIMEOUT:-300}
  agent:
    build: {context: .., dockerfile: infra/Dockerfile}
    command: uvicorn agent.main:app --host 0.0.0.0 --port 8009
    volumes:
      - agent_audit:/data
    environment:
      ALLOWED_TOOLS: ${ALLOWED_TOOLS:-}

volumes:
  memory_data:
  whisper_cache:
  session_data:
  agent_audit:
